
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Kit Festa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FORMULÁRIO -->
    <div id="formulario">

        <h2>Rifa Kit Festa 20 pessoas</h2>

        <p>
            Preencha seus dados. <br>
            Após a validação pelo moderador,
            você receberá seu número!
        </p>

        <form id="rifaForm">

            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone (WhatsApp):</label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>

            <div class="form-group">
                <label for="obs">Vendedor e quantidade vendida:</label>
                <textarea id="obs" name="obs" rows="3"></textarea>
            </div>

            <button type="submit" id="btnSubmit">
                Solicitar Número
            </button>

        </form>

        <div id="mensagem"></div>

    </div>


    <!-- TELA DE CONCLUSÃO -->
    <div id="conclusao">

        <div class="check">✓</div>

        <h2>Solicitação enviada!</h2>

        <p>
            Obrigado por participar da nossa rifa!
        </p>

        <p>
            Seus dados foram enviados com sucesso.
            Aguarde a confirmação do moderador para receber
            seu número da sorte.
        </p>

    </div>


    <script>
        // COLE AQUI A URL GERADA NO PASSO 1 DO GOOGLE APPS SCRIPT
        const API_URL = 'https://script.google.com/macros/s/AKfycbwSQDl4UzG52FazSZATxAbZsRi1jb0u4glTCEk-miwanvGhAW3CD91DLCNqWHc9JMFo/exec';

        document.getElementById('rifaForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const btn = document.getElementById('btnSubmit');
            const msg = document.getElementById('mensagem');

            btn.innerText = 'Enviando...';
            btn.disabled = true;

            const formData = new FormData(this);
            const data = new URLSearchParams(formData);

            fetch(API_URL, {
                method: 'POST',
                body: data
            })
            .then(response => response.json())
            .then(result => {

                // Esconde o formulário
                document.getElementById('formulario').style.display = 'none';

                // Mostra a tela de conclusão
                document.getElementById('conclusao').style.display = 'block';

            })
            .catch(error => {

                msg.style.color = 'red';
                msg.innerText = 'Erro ao enviar. Tente novamente.';

            })
            .finally(() => {

                btn.innerText = 'Solicitar Número';
                btn.disabled = false;

            });
        });
    </script>

</body>
</html>

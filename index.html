
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Kit Festa</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <!-- FORMULÁRIO -->
    <div id="formulario">

        <h2>Rifa Kit Festa 20 pessoas</h2>

        <p>
            Preencha seus dados. <br>
            Após a validação pelo moderador,
            você receberá seu número!
        </p>

        <form id="rifaForm">

            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone (WhatsApp):</label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>

            <div class="form-group">
                <label for="obs">Vendedor e quantidade vendida:</label>
                <textarea id="obs" name="obs" rows="3"></textarea>
            </div>

            <button type="submit" id="btnSubmit">
                Solicitar Número
            </button>

        </form>

        <div id="mensagem"></div>

    </div>


    <!-- TELA DE CONCLUSÃO -->
    <div id="conclusao">

        <div class="check">✓</div>

        <h2>Solicitação enviada!</h2>

        <p>
            Obrigado por participar da nossa rifa!
        </p>

        <p>
            Em breve o moderador irá validar sua solicitação e você receberá seu número.
        </p>

    </div>
</body>
</html>
